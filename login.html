<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION | Logística Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-page bg-light">
    
    <header class="cabecalho mb-4 sticky-top">
        <div class="container-fluid p-4 pb-0">
            <nav class="navbar navbar-expand-lg bg-white rounded-4 shadow-sm px-3">
                <div class="container-fluid">
                    <div class="d-flex align-items-center text-primary">
                        <i class="fa-solid fa-truck-fast fs-2 me-2"></i>
                        <a href="index.html" class="fs-4 fw-bold text-decoration-none" style="letter-spacing: 1px;">ORION</a>
                    </div>   
                </div>
            </nav>
        </div>
    </header>

    <main class="flex-grow-1">
      <section class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-75">
          <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0 login-panel">
              <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                  <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width:56px; height:56px;">
                    <i class="fa-solid fa-truck-fast fs-4"></i>
                  </div>
                  <h1 class="h4 fw-bold mb-1" id="formTitle">Entrar no ORION</h1>
                  <p class="text-muted mb-0" id="formSubtitle">Acesse sua conta para continuar.</p>
                </div>

                <form id="loginForm" class="row g-3">
                  <div class="col-12">
                    <label for="name" class="form-label">Nome do operador</label>
                    <input id="name" name="nome" type="text" class="form-control" required placeholder="Seu nome completo" autofocus>
                  </div>

                  <div class="col-12">
                    <label for="key" class="form-label">Senha</label>
                    <input id="key" name="senha" type="password" class="form-control" required placeholder="Sua senha">
                  </div>

                  <div class="col-12 d-grid gap-2">
                    <button class="btn btn-primary btn-lg" onclick="login()" type="button">Entrar</button>

                    <button type="button" class="btn btn-outline-secondary" onclick="toggleForms()">Novo Usuário</button>
                  </div>
                </form>

                <form id="registerForm" class="row g-3 d-none">
                  <div class="col-12">
                    <label for="reg-name" class="form-label">Nome Completo</label>
                    <input id="reg-name" name="nome" type="text" class="form-control" required placeholder="Nome completo">
                  </div>
                  <div class="col-12">
                    <label for="cpf" class="form-label">CPF</label>
                    <input id="cpf" name="cpf" type="text" class="form-control" required placeholder="000.000.000-00">
                  </div>
                  <div class="col-12">
                    <label for="email" class="form-label">E-mail</label>
                    <input id="email" name="email" type="email" class="form-control" required placeholder="seu@email.com">
                  </div>
                  <div class="col-12">
                    <label for="function" class="form-label">Função</label>
                    <input id="function" name="function" type="text" class="form-control" required placeholder="Sua função">
                  </div>
                  <div class="col-12">
                    <label for="reg-key" class="form-label">Senha</label>
                    <input id="reg-key" name="senha" type="password" class="form-control" required placeholder="Crie uma senha">
                  </div>
                  <div class="col-12 d-grid gap-2">
                    <button class="btn btn-success btn-lg" onclick="setUser()" type="button">Cadastrar</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="toggleForms()">Voltar ao Login</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white py-5 mt-auto">
        <div class="container text-center text-white-50">
            <div class="d-flex justify-content-center align-items-center mb-3 text-white">
                <i class="fa-solid fa-truck-fast fs-3 me-2"></i>
                <span class="fs-4 fw-bold brand-spacing" style="letter-spacing: 1px;">ORION</span>
            </div>
            <p class="mb-4 small">Transformando dados em caminhos mais curtos.</p>
            <p class="mb-0 small">&copy; 2026 ORION Logística. Protótipo de Sistema.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/set.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
